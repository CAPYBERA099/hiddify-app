name: CI
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build only this platform (empty = all platforms)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - android-apk
          - android-aab
          - windows
          - linux
          - macos
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test.configs/**'
      - '.vscode/'
      - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - android-fix-action-bug
       - new-design-v2 
       # sandbox branch: push access works even when the token has no actions:write.
       # arena/<platform> restricts the build matrix to that platform.
       - 'arena/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    if: "${{!contains(github.event.head_commit.message, 'release: version')}}"
    with:
      upload-artifact: ${{ github.event_name != 'pull_request' }}
      # dispatch input wins; otherwise arena/<platform> restricts the matrix to that platform
      only-platform: >-
        ${{ inputs.platform
            || (startsWith(github.ref, 'refs/heads/arena/android-apk') && 'android-apk')
            || (startsWith(github.ref, 'refs/heads/arena/android-aab') && 'android-aab')
            || (startsWith(github.ref, 'refs/heads/arena/windows') && 'windows')
            || (startsWith(github.ref, 'refs/heads/arena/linux') && 'linux')
            || (startsWith(github.ref, 'refs/heads/arena/macos') && 'macos')
            || '' }}
      
